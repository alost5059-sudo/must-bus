<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MedSafe: Reminder + Interaction Checker</title>
<style>
:root{--bg:#fbf8f3;--ink:#22303a;--green:#1b7f5c;--line:#e4ddd0;--card:#fff;--warn:#c2410c;--muted:#6a7580;--soft:#e8f4ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;line-height:1.4;padding-bottom:84px}
header{padding:16px 16px 10px;display:flex;justify-content:space-between;align-items:baseline}
header h1{margin:0;font-size:22px}
header span{font-size:13px;color:var(--muted)}
main{max-width:600px;margin:0 auto;padding:0 14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--ink);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:#cdd6dc;font:inherit;font-size:15px;padding:10px 4px;border-radius:10px}
nav button.on{background:var(--green);color:#fff;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.banner{border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.low{background:#fff0e6;border-left:5px solid var(--warn)}
.hint{background:var(--soft);border-left:5px solid var(--green)}
.ring{background:var(--green);color:#fff;display:flex;justify-content:space-between;align-items:center}
.ring b{font-size:26px}
.dose{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.dose .t{min-width:72px;font-weight:700;font-size:15px}
.dose .n{flex:1}.dose small{color:var(--muted)}
.dose.done{opacity:.55}.dose.done .n b{text-decoration:line-through}
.dose.late{border-color:var(--warn);background:#fff7f1}
button.b{border:0;background:var(--green);color:#fff;font:inherit;font-weight:700;padding:10px 14px;border-radius:10px}
button.b.o{background:none;color:var(--ink);border:1.5px solid var(--ink);font-weight:600}
button.b.r{background:var(--warn)}
button.b.s{padding:7px 11px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
input,select{width:100%;font:inherit;font-size:16px;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.tl{display:flex;gap:8px;margin-bottom:6px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--green)}
.bar.lowbar i{background:var(--warn)}
h2{font-size:17px;margin:14px 0 8px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
#alert{position:sticky;top:0;z-index:5}
.pop{background:var(--ink);color:#fff;border-radius:10px;padding:10px 12px;margin:0 0 8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.pop button{background:#fff;border:0;border-radius:8px;padding:6px 10px;font:inherit}
#sg button{display:block;width:100%;text-align:left;font:inherit;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:4px;color:var(--ink)}
.scn{display:flex;gap:10px;align-items:flex-start;font-weight:400;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.scn input{width:22px;height:22px;margin-top:2px}
.muted{font-size:13px;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.fl{display:inline-block;margin:0;border:0;background:var(--green);color:#fff;font:inherit;font-weight:700;padding:10px 14px;border-radius:10px;font-size:16px}
label.fl.o{background:none;color:var(--ink);border:1.5px solid var(--ink);font-weight:600}
.tag{background:var(--warn);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px}
.res{border-left:6px solid var(--warn)}.res.Moderate{border-left-color:#9a5b00}.res.Moderate .tag{background:#9a5b00}.res p{margin:4px 0;font-size:14.5px}
</style>
</head>

function find(line){
  const out=[],seen=new Set();

function parse(ctx){
  const c=ctx.toLowerCase(),P=["08:00","14:00","20:00"],r={times:[],dose:1,days:0,food:"any",strength:"",guess:false};
  const m=c.match(/(\d{1,2}(?:\.5)?)\s*[-+x*]\s*(\d{1,2}(?:\.5)?)\s*[-+x*]\s*(\d{1,2}(?:\.5)?)/);
  if(m){const n=[+m[1],+m[2],+m[3]];n.forEach((v,i)=>{if(v>0)r.times.push(P[i])});r.dose=Math.max(...n)||1}
  else if(/\b(qid|qds|four times)/.test(c))r.times=["08:00","12:00","16:00","20:00"];
  else if(/\b(tds|tid|t\.d\.s|thrice|three times)/.test(c))r.times=P;
  else if(/\b(bd|bid|b\.d|twice)/.test(c))r.times=["08:00","20:00"];
  else if(/\b(hs|at night|bedtime)\b/.test(c))r.times=["22:00"];
  else if(/\b(od|qd|once)\b/.test(c))r.times=["08:00"];
  if(!r.times.length){r.times=["08:00"];r.guess=true}
  const d=c.match(/(\d{1,3})\s*(days?|d|weeks?|wks?)\b/);if(d)r.days=+d[1]*(/^w/.test(d[2])?7:1);
  if(/after (meal|food)|post ?prandial/.test(c))r.food="after";
  else if(/before (meal|food|breakfast|lunch|dinner)|empty stomach/.test(c))r.food="before";
  else if(/with (meal|food)/.test(c))r.food="with";
  const s=c.match(/(\d+(?:\.\d+)?)\s*(mg|mcg|g|iu)\b/);if(s)r.strength=s[1]+" "+{mg:"mg",mcg:"mcg",g:"g",iu:"IU"}[s[2]];
  return r;
}
function extract(text){
  const L=text.split(/\n+/),out=[],seen=new Set();
  L.forEach((ln,i)=>{
    const f=find(ln);if(!f.length)return;
    let ctx=ln;if(i+1<L.length&&!find(L[i+1]).length)ctx+=" "+L[i+1];
    f.forEach(K=>{if(seen.has(K.e.g))return;seen.add(K.e.g);out.push({e:K.e,br:K.br,...parse(ctx),on:true})});
  });
  return out;
}

const nzl=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");

function ixId(m){
  const t=nzl(dn(m)+" "+(m.name||""));let best=null,bl=0;
  IX.D.forEach(d=>[d[1],...(d[2]?d[2].split(","):[])].forEach(c=>{const k=nzl(c);if(k.length>=4&&t.includes(k)&&k.length>bl){best=d[0];bl=k.length}}));
  return best;
}
function ixList(list){
  const out=[],ids=list.map(m=>({m,id:ixId(m)}));
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){
    const a=ids[i],b=ids[j];if(!a.id||!b.id)continue;
    if(a.id===b.id){out.push({a:dn(a.m),b:dn(b.m),sev:"Major",dup:1,fx:"Both contain "+dname(a.id)+". Taking them together doubles the dose.",todo:"Use only one."});continue}
    const x=IX.M[[a.id,b.id].sort().join("|")];if(x)out.push({a:dn(a.m),b:dn(b.m),...x});
  }
  return out.sort((p,q)=>(p.sev==="Major"?0:1)-(q.sev==="Major"?0:1));
}

  <label>Dose times</label>${f.times.map((t,i)=>`<div class="tl"><input type="time" class="ft" value="${t}">${f.times.length>1?`<button class="b o s" data-a="rt" data-i="${i}">&times;</button>`:""}</div>`).join("")}
  ${f.times.length<6?'<button class="b o s" data-a="at">+ Add time</button>':""}
  <label>Take</label><select id="ff">${Object.keys(FOOD).map(k=>`<option value="${k}" ${f.food===k?"selected":""}>${{before:"Before food",after:"After food",with:"With food",any:"Any time"}[k]}</option>`).join("")}</select>
  <label>Tablets in stock now</label><input id="fs" type="number" min="0" value="${f.stock}">
  <label>Warn me when days left is</label><input id="fa" type="number" min="1" value="${f.alertDays}">
  <div class="row"><button class="b" data-a="save">${editing?"Save changes":"Save medicine"}</button>${editing?'<button class="b o" data-a="cancel">Cancel</button>':""}</div></div>`;
}

function readForm(){
  if(!$("fn"))return;
  form={name:$("fn").value,strength:$("fst").value.trim(),opts:form.opts||[],note:$("fo").value,dose:parseFloat($("fd").value)||1,times:[...document.querySelectorAll(".ft")].map(i=>i.value),food:$("ff").value,stock:parseInt($("fs").value)||0,alertDays:parseInt($("fa").value)||5};
}

function render(){
  $("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"short"});
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  $("v").innerHTML=view==="today"?vToday():view==="meds"?vMeds():view==="safe"?vSafe():vAdd();
}

function ics(){
  const f=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00";
  const z=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z", e=s=>s.replace(/[,;\\]/g,"\\$&");
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//MUST Medicine Reminder//EN"];
  meds.forEach(m=>m.times.forEach(t=>{
    const [h,mi]=t.split(":").map(Number),s=new Date();s.setHours(h,mi,0,0);
    L.push("BEGIN:VEVENT","UID:"+m.id+t.replace(":","")+"@must-reminder","DTSTAMP:"+z,"DTSTART:"+f(s),"DTEND:"+f(new Date(s.getTime()+5*60000)),"RRULE:FREQ=DAILY",
      "SUMMARY:"+e("Take "+dn(m)),"DESCRIPTION:"+e(desc(m)),"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+e("Take "+dn(m)),"TRIGGER:PT0M","END:VALARM","END:VEVENT");
  }));
  L.push("END:VCALENDAR");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([L.join("\r\n")],{type:"text/calendar"}));
  a.download="medicine-reminders.ics";document.body.appendChild(a);a.click();a.remove();
}

function popup(msg){
  const d=document.createElement("div");d.className="pop";
  d.innerHTML=`<span>${esc(msg)}</span><button>OK</button>`;
  d.querySelector("button").onclick=()=>d.remove();
  $("alert").appendChild(d);
  try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
}

function tick(){
  const now=new Date(),k=dk(now),nm=now.getHours()*60+now.getMinutes();
  doses().forEach(d=>{
    const diff=nm-mins(d.t);
    if(!d.done&&diff>=0&&diff<10&&!notified[k+d.id]){
      notified[k+d.id]=1;
      const msg="Time to take "+dn(d.m)+" ("+d.m.dose+")";
      popup(msg);
      try{if("Notification" in window&&Notification.permission==="granted")new Notification("Medicine reminder",{body:msg})}catch(e){}
    }
  });
  if(view==="today")render();
}

let SG=[], scan={items:[],text:"",busy:false,err:""};
const iname=i=>i.br?i.br+" ("+i.e.g+")":i.e.g;
function suggest(q){
  q=q.trim().toLowerCase();if(q.length<2){SG=[];return""}
  const r=[];
  DB.forEach(e=>{
    if(e.g.toLowerCase().includes(q))r.push({s:e.g.toLowerCase().startsWith(q)?0:1,l:e.g,sub:e.b.join(", "),e,br:""});
    e.b.forEach(b=>{if(b.toLowerCase().includes(q))r.push({s:b.toLowerCase().startsWith(q)?0:1,l:b,sub:e.g,e,br:b})});
  });
  SG=r.sort((a,b)=>a.s-b.s).slice(0,8);
  return SG.map((x,i)=>`<button type="button" data-a="pick" data-i="${i}"><b>${esc(x.l)}</b><br><small>${esc(x.sub||"generic")}</small></button>`).join("");
}
function scanHtml(){
  let h='<div class="card"><b>Scan a prescription</b><div class="muted">Take a clear photo of a printed or typed prescription. The app reads it on your phone and fills in the medicines for you to check.</div>';
  if(scan.busy)return h+'<div class="banner hint" id="scanstat" style="margin-top:10px">Starting...</div></div>';
  h+='<div class="row"><label class="fl" for="fileCam">Take photo</label><label class="fl o" for="fileGal">Choose from gallery</label></div>';
  if(scan.err)h+=`<div class="banner low" style="margin-top:10px">${esc(scan.err)}</div>`;
  if(scan.items.length){
    h+=`<h2>Found ${scan.items.length} medicine${scan.items.length>1?"s":""}</h2><div class="muted">Untick any that are wrong. You can edit each one later in Medicines.</div>`;
    h+=scan.items.map((it,i)=>`<label class="scn"><input type="checkbox" data-a="ck" data-i="${i}" ${it.on?"checked":""}><span><b>${esc(iname(it))}${it.strength?" "+esc(it.strength):""}</b><br><small>${it.dose} per dose &middot; ${it.times.map(t12).join(", ")} &middot; ${FOOD[it.food]||"any time"} &middot; ${it.days?it.days+" days":"no duration"}${it.guess?" &middot; <b style='color:var(--warn)'>schedule not found, check it</b>":""}</small></span></label>`).join("");
    h+='<div class="row"><button class="b" data-a="addsel">Add selected</button><button class="b o" data-a="discard">Discard</button></div>';
  }else if(scan.text)h+='<div class="banner low" style="margin-top:10px">No known medicines were recognised. Handwriting is often unreadable for the app. Try a sharper photo or add manually below.</div>';
  if(scan.text)h+=`<details style="margin-top:8px"><summary class="muted">Text the app read</summary><pre style="white-space:pre-wrap;font-size:12px">${esc(scan.text)}</pre></details>`;
  return h+'</div>';
}
function loadOCR(){return window.Tesseract?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=ok;s.onerror=()=>no(new Error("offline"));document.head.appendChild(s)})}
function prep(file){return new Promise(ok=>{const i=new Image();i.onload=()=>{
  const k=Math.min(1,1800/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;
  const x=c.getContext("2d");x.drawImage(i,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  for(let j=0;j<p.length;j+=4){let g=.299*p[j]+.587*p[j+1]+.114*p[j+2];g=Math.max(0,Math.min(255,(g-128)*1.5+128));p[j]=p[j+1]=p[j+2]=g}
  x.putImageData(d,0,0);ok(c)};i.src=URL.createObjectURL(file)})}
const setStat=t=>{const e=$("scanstat");if(e)e.textContent=t};
async function doScan(file){
  scan={items:[],text:"",busy:true,err:""};render();
  try{
    setStat("Loading the reader (needs internet the first time)...");await loadOCR();
    const c=await prep(file);
    const r=await Tesseract.recognize(c,"eng",{logger:m=>{if(m.status==="recognizing text")setStat("Reading prescription... "+Math.round(m.progress*100)+"%")}});
    scan.text=r.data.text;scan.items=extract(scan.text);
  }catch(e){scan.err="Could not read the image. Check your internet connection and try again."}
  scan.busy=false;render();
}
document.addEventListener("input",e=>{if(e.target.id==="fn"&&$("sg"))$("sg").innerHTML=suggest(e.target.value)});
["fileCam","fileGal"].forEach(id=>{$(id).onchange=e=>{const f=e.target.files[0];e.target.value="";if(f){readForm();doScan(f)}}});
window.addEventListener("error",e=>{const d=document.createElement("div");d.style.cssText="background:#c2410c;color:#fff;padding:8px 12px;font-size:13px";d.textContent="Error: "+e.message;document.body.prepend(d)});
document.addEventListener("click",e=>{
  const n=e.target.closest("nav button");
  if(n){readForm();view=n.dataset.v;if(view!=="add"){editing=null}render();return}
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,m=meds.find(x=>x.id===id),k=dk(new Date());
  if(a==="take"){
    const[mid]=id.split("|"),mm=meds.find(x=>x.id===mid);log[k]=log[k]||{};
    if(log[k][id]){delete log[k][id];mm.stock+=mm.dose}else{log[k][id]=1;mm.stock=Math.max(0,mm.stock-mm.dose)}
    save();render();
  }else if(a==="notif"){Notification.requestPermission().then(render)}
  else if(a==="refill"){const q=parseFloat(prompt("How many tablets did you buy?"));if(q>0){m.stock+=q;save();render()}}
  else if(a==="edit"){form={...m,times:[...m.times],opts:[],strength:m.strength||""};editing=id;view="add";render()}
  else if(a==="del"){if(confirm("Delete "+dn(m)+"?")){meds=meds.filter(x=>x.id!==id);save();render()}}
  else if(a==="ics"){ics()}
  else if(a==="wa"){const t="Refill needed:\n"+meds.filter(isLow).map(x=>"- "+dn(x)+" ("+daysLeft(x)+" days left)").join("\n");window.open("https://wa.me/?text="+encodeURIComponent(t))}
  else if(a==="cam"||a==="gal"){const f=$("file");a==="cam"?f.setAttribute("capture","environment"):f.removeAttribute("capture");f.click()}
  else if(a==="pick"){readForm();const x=SG[+b.dataset.i];form.name=x.br?x.br+" ("+x.e.g+")":x.e.g;form.opts=x.e.s;form.strength="";render()}
  else if(a==="ck"){scan.items[+b.dataset.i].on=b.checked}
  else if(a==="discard"){scan={items:[],text:"",busy:false,err:""};render()}
  else if(a==="addsel"){
    const nm=scan.items.filter(i=>i.on).map(i=>({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:iname(i),strength:i.strength,note:"",dose:i.dose,times:i.times,food:i.food,stock:i.days?Math.round(i.days*i.dose*i.times.length):30,alertDays:i.days&&i.days<5?1:5}));
    if(!okToAdd(nm))return;
    meds.push(...nm);
    scan={items:[],text:"",busy:false,err:""};save();view="meds";render();
  }
  else if(a==="gosafe"){view="safe";render()}
  else if(a==="at"){readForm();form.times.push("12:00");render()}
  else if(a==="rt"){readForm();form.times.splice(+b.dataset.i,1);render()}
  else if(a==="cancel"){editing=null;form=blank();view="meds";render()}
  else if(a==="save"){
    readForm();
    if(!form.name.trim())return alert("Enter the medicine name.");
    if(form.times.some(t=>!t))return alert("Set every dose time.");
    form.times=[...new Set(form.times)].sort();
    const rec={...form};delete rec.opts;
    if(editing){const i=meds.findIndex(x=>x.id===editing),nr={...rec,id:editing};if(!okToAdd([nr],meds.filter(x=>x.id!==editing)))return;meds[i]=nr}
    else{const nr={...rec,id:Date.now().toString(36)};if(!okToAdd([nr]))return;meds.push(nr)}
    editing=null;form=blank();save();view="meds";render();
  }
});
render();tick();setInterval(tick,20000);
</script>
</body>
</html>
